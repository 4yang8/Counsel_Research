<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>상담 실험</title><link rel="stylesheet" href="/workspace.css"><script defer src="/workspace.js"></script><script defer src="/master_controller.js"></script></head>
<body>
  <nav id="work-tabs" role="tablist" aria-label="작업 화면">
    <button id="work-tab-lab" role="tab" aria-selected="true" aria-controls="work-lab" data-view="lab">대화 실험</button>
    <button id="work-tab-production" role="tab" aria-selected="false" aria-controls="work-production" data-view="production">조합별 대량생성</button>
    <button id="work-tab-evaluation" role="tab" aria-selected="false" aria-controls="work-evaluation" data-view="evaluation">평가</button>
  </nav>
  <section id="work-lab" class="work-pane" role="tabpanel" aria-labelledby="work-tab-lab">
  <header id="experiment-tabs-header">
    <div class="workspace-bar">
      <button id="experiment-tabs-toggle" aria-expanded="false" aria-controls="experiment-tabs-row">▸ 실험 탭</button>
      <span id="active-experiment-label"></span>
      <span id="workspace-running" role="status"></span>
      <a id="q3p6-open" href="/q3p6" target="_blank" rel="noopener">Q3p6 분기 실험 ↗</a>
      <a id="routing-open" href="/routing" target="_blank" rel="noopener">라우팅 분석 ↗</a>
      <button id="add-experiment" title="현재 실험 설정을 복사해 독립된 새 탭을 만듭니다. 대화는 복사하지 않습니다." aria-label="새 실험 탭 추가">＋</button>
    </div>
    <div id="experiment-tabs-row" hidden><div id="experiment-tabs" role="tablist" aria-label="실험 탭"></div></div>
  </header>
  <details id="master-controller"><summary>대조실험 컨트롤러 <span id="master-summary"></span></summary><div id="master-body"></div></details>
  <div id="workspace-error" role="status" hidden></div>
  <main id="experiment-panes"></main>
  </section>
  <section id="work-production" class="work-pane" role="tabpanel" aria-labelledby="work-tab-production" hidden><iframe title="조합별 대량생성" data-src="/production"></iframe></section>
  <section id="work-evaluation" class="work-pane" role="tabpanel" aria-labelledby="work-tab-evaluation" hidden><iframe title="대화 평가" data-src="/evaluation"></iframe></section>
  <script src="/workbench.js"></script>
</body></html>
